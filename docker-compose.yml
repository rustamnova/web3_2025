services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - clickhouse

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: navi
      POSTGRES_USER: navi
      POSTGRES_PASSWORD: navi
    volumes:
      - pgdata:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "127.0.0.1:8123:8123"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:15672:15672"

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata: {}
